<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行管理ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Maps API (APIキーを直接記述) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCg4cHbogYAIGUz41VnyjIyoTmA6ORjC2Q&libraries=places&callback=initMapApi" async defer></script>
    <!-- SheetJS (Excel出力用ライブラリ) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
      body { font-family: 'Inter', sans-serif; }
      .sidebar { transition: transform 0.3s ease-in-out; }
      .sidebar-open { transform: translateX(0); }
      .sidebar-closed { transform: translateX(-100%); }
      .modal-backdrop { background-color: rgba(0, 0, 0, 0.5); }
      .url-link { word-break: break-all; }

      /* Autocomplete はモーダルより下げる */
      .pac-container { z-index: 1050 !important; }

      .timeline-container::-webkit-scrollbar { height: 8px; }
      .timeline-container::-webkit-scrollbar-track { background: #f1f1f1; }
      .timeline-container::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
      .timeline-container::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
      details > summary { list-style: none; }
      details > summary::-webkit-details-marker { display: none; }
      details > summary::before { content: '▶'; margin-right: 0.5rem; display: inline-block; transition: transform 0.2s; }
      details[open] > summary::before { transform: rotate(90deg); }

      /* 修正: モーダルコンテンツのz-indexをCSSで一元管理 */
      .modal-content { position: relative; z-index: 1000; }

      /* モーダル表示中は背面の地図iframeを無効化（iOSタップ吸い取り対策） */
      body.modal-open .map-container iframe { pointer-events: none; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="app" class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="sidebar sidebar-closed fixed inset-y-0 left-0 z-40 w-64 bg-white shadow-lg md:relative md:translate-x-0">
            <div class="flex flex-col h-full p-4">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold text-gray-800">旅行リスト</h2>
                    <button id="close-sidebar-btn" class="md:hidden text-gray-500 hover:text-gray-800">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <nav id="trip-list" class="flex-1 overflow-y-auto mb-4"></nav>
                <button id="add-trip-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300">新しい旅行を追加</button>
                <div id="mileage-info" class="mt-6 pt-6 border-t border-gray-200"></div>
            </div>
        </aside>
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-md">
                <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between h-16">
                        <div class="flex items-center min-w-0">
                            <button id="open-sidebar-btn" class="md:hidden text-gray-500 hover:text-gray-800 mr-4 flex-shrink-0">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                                </svg>
                            </button>
                            <h1 id="current-trip-name" class="text-xl md:text-2xl font-bold text-gray-900 truncate">旅行を選択</h1>
                        </div>
                    </div>
                    <div id="header-controls" class="hidden py-3 border-t border-gray-200 sm:flex items-center justify-between gap-4">
                        <div id="date-filter-container" class="flex items-center gap-2 min-w-0">
                            <label for="date-filter" class="hidden sm:block text-sm text-gray-600 flex-shrink-0">日付フィルター:</label>
                            <input type="date" id="date-filter" class="border-gray-300 rounded-md shadow-sm text-sm p-2 w-full">
                            <button id="clear-date-filter" class="text-gray-500 hover:text-red-500 p-2 flex-shrink-0" title="フィルターを解除">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                        <button id="export-excel-btn" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold p-2 sm:py-2 sm:px-4 rounded-full sm:rounded-lg shadow-md transition duration-300 flex items-center flex-shrink-0 mr-2">
                            <svg class="w-6 h-6 sm:w-5 sm:h-5 sm:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            <span class="hidden sm:inline">Excel出力</span>
                        </button>
                        <button id="add-schedule-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold p-2 sm:py-2 sm:px-4 rounded-full sm:rounded-lg shadow-md transition duration-300 flex items-center flex-shrink-0">
                            <svg class="w-6 h-6 sm:w-5 sm:h-5 sm:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                            </svg>
                            <span class="hidden sm:inline">予定を追加</span>
                        </button>
                    </div>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto bg-gray-100 p-4 sm:p-6 lg:p-8">
                <div id="schedule-list" class="flex space-x-6 overflow-x-auto pb-4 timeline-container"></div>
                <div id="welcome-message" class="text-center text-gray-500 mt-10">
                    <p class="text-lg">左のメニューから旅行を選択するか、新しい旅行を追加してください。</p>
                </div>
            </main>
        </div>
    </div>
    <div id="modal" class="fixed inset-0 z-50 items-center justify-center hidden">
        <div class="modal-backdrop fixed inset-0 bg-black opacity-50"></div>
        <!-- 修正: Tailwindのz-50クラスを削除し、CSSのz-index: 1000が適用されるようにする -->
        <div class="modal-content bg-white rounded-lg shadow-xl w-11/12 md:max-w-md mx-auto p-6 overflow-y-auto max-h-screen">
            <h3 id="modal-title" class="text-2xl font-bold mb-4"></h3>
            <form id="modal-form"></form>
        </div>
    </div>
    <div id="loading-spinner" class="fixed inset-0 z-50 bg-white bg-opacity-75 flex items-center justify-center hidden">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500"></div>
    </div>
    <div id="toast" class="fixed bottom-5 right-5 bg-green-500 text-white py-2 px-4 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50">
        <p id="toast-message"></p>
    </div>

    <script>
      // ★★★★★【要設定】先ほど取得したGASのウェブアプリURLを貼り付けてください ★★★★★
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzuV3TY4d7-6UyNJPLrr0xSdLhwQNHjWaVgTuaM60xlXDC9b75Ebpak_TXELS9x6Cxn7w/exec";
        const API_KEY = "AIzaSyCg4cHbogYAIGUz41VnyjIyoTmA6ORjC2Q";

        let state = {
            tripLists: { active: [], archived: [] },
            currentTrip: null,
            schedules: [],
            mileage: {},
            isEditing: false,
            editingId: null,
            scheduleCache: {},
        };
        
        let directionsService;
        let currentAutocomplete = null; 
        let pacObserver = null; 

        // Google Maps APIのコールバック関数
        function initMapApi() {
            if (typeof google !== 'undefined' && google.maps) {
                directionsService = new google.maps.DirectionsService();
            }
        }

        // サーバーとの通信 (fetch + text/plain でCORS回避)
        async function serverCall(action, ...args) {
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain', // GASへのPOSTはtext/plainにする必要があります
                    },
                    body: JSON.stringify({ action: action, args: args })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    return result.data;
                } else {
                    throw new Error(result.error || 'API側でエラーが発生しました');
                }
            } catch (error) {
                console.error('Server Call Error:', error);
                showToast(`通信エラー: ${error.message}`, 'error');
                throw error;
            }
        }

        // Autocompleteを安全に破棄
        function destroyAutocompleteIfAny() {
            try {
                if (currentAutocomplete) {
                    google.maps.event.clearInstanceListeners(currentAutocomplete);
                    if (currentAutocomplete.unbindAll) currentAutocomplete.unbindAll();
                }
            } catch (e) {
                console.warn('Failed to destroy autocomplete:', e);
            }
            currentAutocomplete = null;
        }

        // --- ここから下は、ページの準備が完了してから実行される ---
        window.onload = () => {
            
            // --- DOM要素の取得 ---
            const sidebar = document.getElementById('sidebar');
            const openSidebarBtn = document.getElementById('open-sidebar-btn');
            const closeSidebarBtn = document.getElementById('close-sidebar-btn');
            const tripList = document.getElementById('trip-list');
            const addTripBtn = document.getElementById('add-trip-btn');
            const mileageInfo = document.getElementById('mileage-info');
            const currentTripNameEl = document.getElementById('current-trip-name');
            const addScheduleBtn = document.getElementById('add-schedule-btn');
            const scheduleList = document.getElementById('schedule-list');
            const welcomeMessage = document.getElementById('welcome-message');
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const modalForm = document.getElementById('modal-form');
            const loadingSpinner = document.getElementById('loading-spinner');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const headerControls = document.getElementById('header-controls');
            const dateFilterInput = document.getElementById('date-filter');
            const clearDateFilterBtn = document.getElementById('clear-date-filter');
            
            // --- UIヘルパー関数 ---
            function showLoading(isLoading) { loadingSpinner.classList.toggle('hidden', !isLoading); }
            function showToast(message, type = 'success') {
                toastMessage.textContent = message;
                toast.className = `fixed bottom-5 right-5 text-white py-2 px-4 rounded-lg shadow-lg transition-opacity duration-300 z-50 ${type === 'error' ? 'bg-red-500' : 'bg-green-500'}`;
                toast.classList.remove('opacity-0');
                setTimeout(() => { toast.classList.add('opacity-0'); }, 3000);
            }
            function hideModal() {
                // iOSのフォーカス残り対策
                if (document.activeElement && typeof document.activeElement.blur === 'function') {
                    document.activeElement.blur();
                }

                // Autocompleteと監視を確実に破棄
                destroyAutocompleteIfAny();
                if (pacObserver) { try { pacObserver.disconnect(); } catch (_) {} pacObserver = null; }

                // 残骸のドロップダウンも削除
                document.querySelectorAll('.pac-container').forEach(el => el.remove());

                // モーダルクローズ
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                
                modalForm.innerHTML = '';

                // 背面地図の無効化解除
                document.body.classList.remove('modal-open');
            }

            // --- 描画関数 ---
            function renderTrips() {
                tripList.innerHTML = '';
                const createTripListItem = (tripName, isArchived = false) => {
                    const itemContainer = document.createElement('div'); itemContainer.className = 'relative group';
                    const button = document.createElement('button'); button.className = `w-full text-left pr-10 pl-4 py-2 rounded-lg transition duration-200 ${state.currentTrip === tripName ? 'bg-blue-100 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-100'}`;
                    button.textContent = tripName; button.addEventListener('click', () => handleTripSelect(tripName));
                    const menuButton = document.createElement('button'); menuButton.className = 'absolute right-1 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-gray-700 rounded-full opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity';
                    menuButton.innerHTML = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"></path></svg>`;
                    menuButton.addEventListener('click', (e) => { e.stopPropagation(); toggleTripMenu(e.currentTarget); });
                    const menuDropdown = document.createElement('div'); menuDropdown.className = 'trip-menu hidden absolute right-0 mt-2 w-40 bg-white rounded-md shadow-lg z-10 border';
                    menuDropdown.innerHTML = `<button class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-action="${isArchived ? 'unarchive' : 'archive'}" data-trip-name="${tripName}">${isArchived ? 'アクティブに戻す' : 'アーカイブする'}</button><button class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50" data-action="delete" data-trip-name="${tripName}">削除</button>`;
                    itemContainer.append(button, menuButton, menuDropdown); return itemContainer;
                };
                if(state.tripLists.active) state.tripLists.active.forEach(tripName => tripList.appendChild(createTripListItem(tripName, false)));
                if (state.tripLists.archived && state.tripLists.archived.length > 0) {
                    const details = document.createElement('details'); details.className = 'mt-4 pt-4 border-t';
                    const summary = document.createElement('summary'); summary.className = 'font-semibold text-gray-500 cursor-pointer'; summary.textContent = 'アーカイブ';
                    details.appendChild(summary);
                    const archivedList = document.createElement('div'); archivedList.className = 'mt-2 space-y-1';
                    state.tripLists.archived.forEach(tripName => archivedList.appendChild(createTripListItem(tripName, true)));
                    details.appendChild(archivedList); tripList.appendChild(details);
                }
            }

            function renderMileage() {
                const renderItem = (p, a) => {
                    const n = state.mileage?.[p]?.[a] || '未設定';
                    return `<div class="flex items-center justify-between text-sm">
                            <span class="font-medium text-gray-600">${a}:</span>
                            <div class="flex items-center gap-2">
                                <span id="mileage-${p}-${a}" class="text-gray-800">${n}</span>
                                <button data-person="${p}" data-airline="${a}" class="copy-btn text-gray-400 hover:text-blue-500" title="${p}さんの${a}番号をコピー">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2z"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>`;
                };
                const renderSection = p => `
                    <div>
                        <h4 class="font-bold text-md text-gray-600">${p}</h4>
                        <div class="mt-1 space-y-2">
                            ${renderItem(p, 'ANA')}
                            ${renderItem(p, 'JAL')}
                        </div>
                    </div>`;

                mileageInfo.innerHTML = `
                    <h3 class="text-lg font-semibold text-gray-700 mb-3">マイレージ情報</h3>
                    <div class="space-y-4">
                        ${renderSection('ぱら')}
                        ${renderSection('りな')}
                    </div>
                    <button id="edit-mileage-btn" class="mt-4 w-full text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg">編集</button>
                `;

                document.querySelectorAll('.copy-btn').forEach(btn => btn.addEventListener('click', handleCopyMileage));
                document.getElementById('edit-mileage-btn').addEventListener('click', showEditMileageModal);
            }

            function renderSchedules(filterDate = null) {
                scheduleList.innerHTML = '';
                let schedulesToRender = state.schedules;
                if (filterDate) {
                    schedulesToRender = state.schedules.filter(s => {
                        const d = new Date(s.datetime);
                        const y = d.getFullYear();
                        const m = String(d.getMonth() + 1).padStart(2, '0');
                        const dd = String(d.getDate()).padStart(2, '0');
                        return `${y}-${m}-${dd}` === filterDate;
                    });
                }
                if (!schedulesToRender || schedulesToRender.length === 0) {
                    const message = filterDate ? `「${filterDate}」の予定はありません。` : 'この旅行にはまだ予定がありません。';
                    scheduleList.innerHTML = `<p class="text-gray-500 text-center w-full">${message}</p>`;
                    return;
                }

                const groupedByDate = schedulesToRender.reduce((acc, schedule) => {
                    const date = new Date(schedule.datetime);
                    const dateString = !isNaN(date.getTime())
                        ? date.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' })
                        : '日付未定';
                    if (!acc[dateString]) acc[dateString] = [];
                    acc[dateString].push(schedule);
                    return acc;
                }, {});

                for (const dateString in groupedByDate) {
                    const dayColumn = document.createElement('div'); dayColumn.className = 'flex-shrink-0 w-80 md:w-96';
                    const dayHeader = document.createElement('h3'); dayHeader.className = 'text-lg font-bold text-gray-700 mb-3 sticky top-0 bg-gray-100 py-2'; dayHeader.textContent = dateString;
                    dayColumn.appendChild(dayHeader);
                    const cardsContainer = document.createElement('div'); cardsContainer.className = 'space-y-4';

                    groupedByDate[dateString].forEach(s => {
                        const date = new Date(s.datetime); 
                        const formattedTime = !isNaN(date.getTime()) ? `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}` : '';
                        const card = document.createElement('div'); card.className = 'bg-white rounded-lg shadow-md p-4 flex flex-col';
                        card.innerHTML = `
                            <div class="flex-1">
                                <div class="flex justify-between items-start mb-2">
                                    <p class="text-lg font-bold text-gray-600">${formattedTime}</p>
                                    <div class="flex space-x-2 flex-shrink-0">
                                        <button class="edit-btn text-gray-400 hover:text-blue-500" data-id="${s.id}" title="編集">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L14.732 3.732z"></path></svg>
                                        </button>
                                        <button class="delete-btn text-gray-400 hover:text-red-500" data-id="${s.id}" title="削除">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </div>
                                </div>
                                <h4 class="text-xl font-bold text-gray-800">${s.destination||'(件名なし)'}</h4>
                                <div class="flex items-center flex-wrap gap-2 mt-2">
                                    ${s.method?`<span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">${s.method}</span>`:''}
                                    ${s.seatInfo?`<span class="bg-gray-200 text-gray-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">${s.seatInfo}</span>`:''}
                                </div>
                                ${s.address?`<p class="text-sm text-gray-600 mt-2">${s.address}</p>`:''}
                                ${s.parkingInfo?`
                                    <div class="mt-2 flex items-start text-xs text-gray-500 gap-1.5">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" /></svg>
                                        <p class="whitespace-pre-wrap">${s.parkingInfo}</p>
                                    </div>`:''}
                                ${s.parkingUrl?`<a href="${s.parkingUrl}" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-500 hover:underline mt-1 block url-link">駐車場URL</a>`:''}
                                <div class="space-y-1 mt-2">
                                    ${s.url?`<a href="${s.url}" target="_blank" rel="noopener noreferrer" class="text-sm text-blue-500 hover:underline block url-link">参考URL 1</a>`:''}
                                    ${s.url2?`<a href="${s.url2}" target="_blank" rel="noopener noreferrer" class="text-sm text-blue-500 hover:underline block url-link">参考URL 2</a>`:''}
                                </div>
                                ${s.memo?`<p class="text-sm text-gray-700 bg-gray-50 p-2 mt-2 rounded-md whitespace-pre-wrap">${s.memo}</p>`:''}
                                ${s.address?`
                                    <div class="mt-3 pt-3 border-t border-gray-200">
                                        <div class="flex items-center gap-2">
                                            <button class="toggle-map-btn text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-1 px-3 rounded-lg" data-address="${s.address}">地図を表示</button>
                                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}" target="_blank" rel="noopener noreferrer" class="text-xs bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold py-1 px-3 rounded-lg">アプリで開く</a>
                                        </div>
                                        <div class="map-container hidden mt-2 h-48 bg-gray-200 rounded-lg overflow-hidden"></div>
                                    </div>`:''}
                            </div>`;
                        cardsContainer.appendChild(card);
                    });
                    dayColumn.appendChild(cardsContainer); 
                    scheduleList.appendChild(dayColumn);
                }

                document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => showScheduleModal(true, e.currentTarget.dataset.id)));
                document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', (e) => handleDeleteSchedule(e.currentTarget.dataset.id)));
                document.querySelectorAll('.toggle-map-btn').forEach(btn => btn.addEventListener('click', handleMapToggle));
            }

            // --- コアロジック ---
            async function init() {
                showLoading(true);
                try {
                    const [tripLists, mileage] = await Promise.all([serverCall('getTrips'), serverCall('getMileage')]);
                    state.tripLists = tripLists || { active: [], archived: [] };
                    state.mileage = mileage || { 'ぱら': {}, 'りな': {} };
                    renderTrips();
                    renderMileage();
                    const lastTrip = localStorage.getItem('lastSelectedTrip');
                    if (lastTrip && (state.tripLists.active.includes(lastTrip) || state.tripLists.archived.includes(lastTrip))) {
                        await handleTripSelect(lastTrip); 
                    } else {
                        headerControls.classList.add('hidden');
                        headerControls.classList.remove('flex', 'sm:flex');
                    }
                } catch (error) {
                    console.error("Initialization failed", error);
                    welcomeMessage.innerHTML = `<p class="text-red-500">データの初期化に失敗しました。</p>`;
                } finally {
                    showLoading(false);
                }
            }

            async function handleTripSelect(tripName) {
                state.currentTrip = tripName;
                localStorage.setItem('lastSelectedTrip', tripName);
                currentTripNameEl.textContent = tripName;
                welcomeMessage.classList.add('hidden');
                headerControls.classList.remove('hidden');
                headerControls.classList.add('flex', 'sm:flex');
                dateFilterInput.value = '';
                renderTrips();

                if (state.scheduleCache[tripName]) {
                    state.schedules = state.scheduleCache[tripName];
                    renderSchedules();
                    return;
                }
                
                scheduleList.innerHTML = `<div class="text-center text-gray-500 p-10 w-full">データを読み込んでいます...</div>`;
                try {
                    const schedules = await serverCall('getSchedules', tripName);
                    if (state.currentTrip !== tripName) return;
                    state.schedules = schedules || [];
                    state.scheduleCache[tripName] = state.schedules;
                    renderSchedules();
                } catch (error) {
                    console.error(`Failed to get schedules for ${tripName}`, error);
                    scheduleList.innerHTML = `<div class="text-center text-red-500 p-10 w-full">予定の読み込みに失敗しました。</div>`;

            }

            async function handleScheduleSubmit(e) {
                e.preventDefault();
                
                // モバイルでのキーボード問題を回避するために、アクティブな要素からフォーカスを外す
                if (document.activeElement) {
                    document.activeElement.blur();
                }

                const submitBtn = modalForm.querySelector('button[type="submit"]');
                if (!submitBtn) {
                    console.error("Submit button not found in modal.");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '保存中...';
                
                try {
                    const formData = new FormData(modalForm); 
                    let methodValue = formData.get('method'); if (methodValue === '指定なし') methodValue = '';
                    const dateStr = formData.get('date'); const timeStr = formData.get('time'); 
                    const localDateTime = new Date(`${dateStr}T${timeStr}`);
                    const finalSchedule = { 
                        id: state.isEditing ? state.editingId : null, 
                        method: methodValue, 
                        datetime: localDateTime.toISOString(), 
                        destination: formData.get('destination'), 
                        address: formData.get('address') || '', 
                        url: formData.get('url') || '', 
                        url2: formData.get('url2') || '', 
                        memo: formData.get('memo'), 
                        seatInfo: formData.get('seatInfo') || '', 
                        parkingInfo: document.getElementById('parking-toggle').checked ? formData.get('parkingInfo') : '', 
                        parkingUrl: document.getElementById('parking-toggle').checked ? formData.get('parkingUrl') : '' 
                    };
                    const action = state.isEditing ? 'updateSchedule' : 'addSchedule';
                    await serverCall(action, state.currentTrip, finalSchedule);
                    delete state.scheduleCache[state.currentTrip];
                    hideModal(); 
                    showToast(`予定を${state.isEditing ? '更新' : '追加'}しました`);
                    await handleTripSelect(state.currentTrip);
                } catch (error) { 
                    showToast(error.message, 'error');
                    // エラーが発生した場合にのみ、ボタンの状態を元に戻します
                    if(submitBtn) {
                        submitBtn.disabled = false; 
                        submitBtn.textContent = '保存';
                    }
                }
            }

            function handleRouteSearch() { 
                const o = document.getElementById('origin').value, d = document.getElementById('address').value, r = document.getElementById('route-results');
                if (!o || !d) { r.innerHTML = `<p class="text-red-600">出発地と目的地を入力してください。</p>`; return; }
                r.innerHTML = `<p class="text-gray-500">検索中...</p>`;
                const t = document.getElementById('method').value === '徒歩' ? 'WALKING' : 'DRIVING';
                directionsService.route({origin:o,destination:d,travelMode:google.maps.TravelMode[t]},(res,s)=>{
                    if (s==='OK') {
                        const l = res.routes[0].legs[0];
                        r.innerHTML = `<div class="p-2 bg-green-50 border-l-4 border-green-400"><p><strong>距離:</strong> ${l.distance.text}</p><p><strong>所要時間:</strong> ${l.duration.text}</p></div>`;
                        const m = document.getElementById('memo');
                        const i = `[ルート情報: ${o} → ${d}, 所要時間: ${l.duration.text}]`;
                        let c = m.value.replace(/\[ルート情報:.*?\]\n?/, '');
                        m.value = `${i}\n${c}`.trim();
                    } else {
                        r.innerHTML = `<p class="text-red-600">ルートが見つかりませんでした: ${s}</p>`;
                    }
                });
            }

            function handleMapToggle(e) {
                const button = e.currentTarget;
                const cardBody = button.closest('.flex-1');

                const mapContainer = cardBody.querySelector('.map-container');
                if (!mapContainer) return;
                
                const isHidden = mapContainer.classList.contains('hidden');

                if (isHidden) {
                    if (!mapContainer.dataset.mapLoaded) {
                        const address = button.dataset.address;
                        const iframe = document.createElement('iframe');
                        iframe.width = '100%';
                        iframe.height = '100%';
                        iframe.frameBorder = '0';
                        iframe.style.border = '0';
                        iframe.src = `https://www.google.com/maps/embed/v1/place?key=${API_KEY}&q=${encodeURIComponent(address)}`;
                        iframe.allowFullscreen = true;
                        mapContainer.innerHTML = '';
                        mapContainer.appendChild(iframe);
                        mapContainer.dataset.mapLoaded = 'true';
                    }
                    mapContainer.classList.remove('hidden');
                    button.textContent = '地図を隠す';

                    mapContainer.classList.add('hidden');

            // Excel出力ボタンのイベントリスナー
            document.getElementById('export-excel-btn').addEventListener('click', handleExportExcel);

            // Excel出力処理 (SheetJSを使用)
            function handleExportExcel() {
                if (!state.schedules || state.schedules.length === 0) {
                    showToast('出力する予定データがありません', 'error');
                    return;
                }

                // 出力用にデータを整形
                const exportData = state.schedules.map(s => {
                    const d = new Date(s.datetime);
                    const dateStr = !isNaN(d.getTime()) ? d.toLocaleString('ja-JP') : '未定';
                    return {
                        '日時': dateStr,
                        '件名': s.destination || '',
                        '移動手段': s.method || '',
                        '場所・住所': s.address || '',
                        '座席情報': s.seatInfo || '',
                        'メモ': s.memo || '',
                        '駐車場情報': s.parkingInfo || '',
                        '参考URL1': s.url || '',
                        '参考URL2': s.url2 || ''
                    };
                });

                // SheetJSでワークブックを作成
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "スケジュール");

                // Excelファイルとしてダウンロード (.xlsx)
                const fileName = `${state.currentTrip || '旅行'}_スケジュール.xlsx`;
                XLSX.writeFile(workbook, fileName);
                
                showToast('Excelファイルを出力しました');
            }
            // --- 初期化実行 ---
            init();
        };
    </script>
</body>
</html>
