<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅行">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>旅行管理ツール</title>
<link rel="icon" href="favicon_travel.png" type="image/png">
<link rel="apple-touch-icon" href="favicon_travel.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<script>function initMapApi() {}</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCg4cHbogYAIGUz41VnyjIyoTmA6ORjC2Q&libraries=places&callback=initMapApi" async defer></script>
<style>
  :root{
    --bg:#f7f2ea; --ink:#27323a; --sub:#6b7780; --line:#e6ddd0;
    --teal:#0f766e; --sky:#0ea5e9; --orange:#ff7a45; --pink:#ff5e7e;
  }
  html,body{height:100%;}
  body{font-family:'Zen Maru Gothic',sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;}
  body.modal-open,body.dragging{overflow:hidden;}
  body.dragging{user-select:none;-webkit-user-select:none;}
  input,select,textarea{font-size:16px !important;} /* iOSの自動ズーム防止 */
  .pac-container{z-index:2000 !important;}

  /* ヘッダー */
  .hero{background:linear-gradient(135deg,var(--teal) 0%,var(--sky) 100%);color:#fff;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);}
  .hero::before{content:"";position:absolute;right:60px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);}

  /* サイドバー */
  .sidebar{transition:transform .3s ease;}
  @media (max-width:767px){ .sidebar-closed{transform:translateX(-100%);} }
  #sidebar-overlay{display:none;}
  #sidebar-overlay.show{display:block;}
  .trip-item{display:block;width:100%;text-align:left;padding:.6rem .9rem;padding-right:2.4rem;border-radius:.9rem;transition:.2s;}
  .trip-item.active{background:linear-gradient(135deg,#ccfbf1,#e0f2fe);color:var(--teal);font-weight:700;}
  .trip-item:not(.active):hover{background:#f3efe8;}

  /* 日付チップ */
  #day-bar{position:sticky;top:0;z-index:10;background:rgba(247,242,234,.92);backdrop-filter:blur(8px);}
  .day-chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:64px;padding:.4rem .8rem;border-radius:1rem;background:#fff;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:.15s;}
  .day-chip .d1{font-size:.65rem;color:var(--sub);}
  .day-chip .d2{font-size:.9rem;font-weight:700;}
  .day-chip.active{background:linear-gradient(135deg,var(--teal),var(--sky));color:#fff;}
  .day-chip.active .d1{color:rgba(255,255,255,.8);}
  .day-chip.drop-target{border-color:var(--orange);transform:scale(1.08);background:#fff4ec;color:var(--ink);}
  .day-chip.drop-target .d1{color:var(--sub);}

  /* タイムライン */
  .sch-row{display:flex;gap:6px;padding-bottom:14px;position:relative;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;}
  .sch-row.dragging{opacity:.3;}
  .time-col{width:54px;flex:0 0 54px;text-align:right;padding-top:12px;}
  .time-chip{font-weight:700;font-size:1.05rem;color:var(--teal);padding:2px 6px;border-radius:.6rem;}
  .time-chip:active{background:#ccfbf1;}
  .rail{width:16px;flex:0 0 16px;position:relative;}
  .rail::before{content:"";position:absolute;left:7px;top:0;bottom:-14px;width:2px;background:repeating-linear-gradient(to bottom,#cbbfae 0 6px,transparent 6px 10px);}
  .sch-row:last-child .rail::before{bottom:14px;}
  .rail .dot{position:absolute;left:1px;top:18px;width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--accent,#94a3b8);}
  .card-main{flex:1;min-width:0;background:#fff;border-radius:1.1rem;padding:.85rem 1rem;box-shadow:0 2px 8px rgba(80,60,30,.08);border-left:5px solid var(--accent,#94a3b8);}
  .drag-ghost{position:fixed;z-index:3000;pointer-events:none;opacity:.95;transform:scale(1.03);filter:drop-shadow(0 12px 18px rgba(0,0,0,.25));}
  .tag{display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:700;padding:.15rem .6rem;border-radius:999px;}
  .link-chip{display:inline-block;font-size:.75rem;padding:.2rem .65rem;border-radius:999px;background:#e0f2fe;color:#0369a1;font-weight:700;}
  .icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;color:#9aa5ad;}
  .icon-btn:hover,.icon-btn:active{background:#f3efe8;color:var(--ink);}


  /* 24時間軸(ドラッグ中だけ表示) */
  #axis{position:fixed;z-index:2500;background:rgba(247,242,234,.98);box-shadow:inset 0 8px 8px -8px rgba(0,0,0,.25);}
  #axis-scroll{position:absolute;inset:0;overflow:hidden;}
  #axis-track{position:relative;}
  .ax-hour{position:absolute;left:0;right:0;border-top:1px solid #d9cfbf;}
  .ax-hour span{position:absolute;left:8px;top:-9px;font-size:.75rem;font-weight:700;color:var(--sub);background:rgba(247,242,234,.98);padding:0 4px;}
  .ax-half{position:absolute;left:56px;right:0;border-top:1px dashed #e6ddd0;}
  .ax-item{position:absolute;max-width:140px;height:22px;line-height:18px;padding:2px 8px;border-radius:8px;font-size:.72rem;background:#fff;border-left:4px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;}
  #ax-line{position:absolute;left:0;right:0;border-top:2px solid var(--orange);display:none;pointer-events:none;}
  #ax-badge{position:absolute;left:6px;top:-15px;background:var(--orange);color:#fff;font-weight:700;font-size:.85rem;padding:1px 8px;border-radius:999px;}
  .drag-chip{display:flex;align-items:center;gap:8px;padding:.55rem .9rem;border-radius:1rem;background:#fff;border-left:5px solid var(--accent,#94a3b8);font-weight:700;}
  .drag-chip .gt{color:var(--orange);font-size:1.1rem;}
  .drag-chip .gn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* FAB */
  #fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;font-size:2rem;line-height:1;box-shadow:0 8px 20px rgba(255,94,126,.45);z-index:30;display:none;align-items:center;justify-content:center;transition:transform .15s;}
  #fab:active{transform:scale(.92);}
  #fab.show{display:flex;}

  /* モーダル(ボトムシート) */
  #modal{display:none;position:fixed;inset:0;z-index:50;align-items:flex-end;justify-content:center;}
  #modal.open{display:flex;}
  @media (min-width:768px){ #modal{align-items:center;} }
  #modal-sheet{max-height:92vh;max-height:92dvh;animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .field{display:block;width:100%;margin-top:.25rem;padding:.6rem .75rem;border:1.5px solid var(--line);border-radius:.8rem;background:#fffdf9;}
  .field:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(14,165,233,.15);}
  .lbl{font-size:.78rem;font-weight:700;color:var(--sub);}
  .m-chip{flex:0 0 auto;padding:.45rem .8rem;border-radius:999px;border:1.5px solid var(--line);background:#fffdf9;font-size:.85rem;font-weight:700;}
  .m-chip.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  details.more>summary{list-style:none;cursor:pointer;padding:.6rem .8rem;border-radius:.8rem;background:#f3efe8;font-weight:700;font-size:.85rem;color:var(--sub);}
  details.more>summary::-webkit-details-marker{display:none;}
  details.more[open]>summary{margin-bottom:.75rem;}
  .no-scrollbar::-webkit-scrollbar{display:none;} .no-scrollbar{scrollbar-width:none;}

  #toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3500;padding:.5rem 1.1rem;border-radius:999px;color:#fff;font-weight:700;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;}
</style>
</head>
<body>
<div id="app" class="flex overflow-hidden" style="height:100vh;height:100dvh;">

  <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-30 md:hidden"></div>
  <aside id="sidebar" class="sidebar sidebar-closed fixed inset-y-0 left-0 z-40 w-72 bg-white shadow-xl md:static md:shadow-none md:border-r md:border-[var(--line)]">
    <div class="flex flex-col h-full p-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold">🧳 旅行リスト</h2>
        <button id="close-sidebar-btn" class="icon-btn md:hidden" aria-label="閉じる">✕</button>
      </div>
      <nav id="trip-list" class="flex-1 overflow-y-auto mb-3"></nav>
      <button id="add-trip-btn" class="w-full text-white font-bold py-2.5 rounded-2xl" style="background:linear-gradient(135deg,var(--teal),var(--sky));">＋ 新しい旅行</button>
      <div id="mileage-info" class="mt-4 pt-4 border-t border-[var(--line)]"></div>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="hero px-4 pt-3 pb-4" style="padding-top:max(12px,env(safe-area-inset-top));">
      <div class="flex items-center gap-3 relative z-10">
        <button id="open-sidebar-btn" class="md:hidden w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-xl flex-shrink-0" aria-label="メニュー">☰</button>
        <div class="min-w-0">
          <p class="text-xs opacity-80">✈ TRAVEL PLANNER</p>
          <h1 id="current-trip-name" class="text-xl md:text-2xl font-bold truncate">旅行を選択</h1>
          <p id="trip-sub" class="text-xs opacity-90"></p>
          <p id="offline-badge" class="hidden text-xs mt-1 inline-block bg-white/25 px-2 py-0.5 rounded-full">📴 オフライン(保存済みデータを表示中)</p>
        </div>
      </div>
    </header>

    <main id="main" class="flex-1 overflow-y-auto relative">
      <div id="day-bar" class="px-4 py-3 hidden"><div id="day-chips" class="flex gap-2 overflow-x-auto no-scrollbar"></div></div>
      <div class="px-4 pb-28 pt-2 max-w-2xl mx-auto">
        <div id="hint" class="hidden mb-3 text-xs text-[var(--sub)] bg-white/70 rounded-xl px-3 py-2 flex gap-2 items-start">
          <span>💡 カードを<b>長押し→ドラッグ</b>すると24時間軸が現れ、置いた位置(10分単位)が開始時刻になります。上の日付にドロップで日付移動、時刻をタップで時刻変更もできます。</span>
          <button id="hint-close" class="ml-auto flex-shrink-0">✕</button>
        </div>
        <div id="schedule-list"></div>
        <div id="welcome-message" class="text-center text-[var(--sub)] mt-16">
          <p class="text-5xl mb-3">🗺️</p>
          <p class="font-bold">旅行を選んで計画をはじめよう</p>
          <p class="text-sm mt-1">左上のメニューから旅行を選択、または新規作成してください。</p>
        </div>
      </div>
    </main>
  </div>
</div>

<button id="fab" aria-label="予定を追加">＋</button>

<div id="modal">
  <div id="modal-backdrop" class="absolute inset-0 bg-black/50"></div>
  <form id="modal-form" novalidate></form>
</div>
<div id="loading-spinner" class="fixed inset-0 z-[4000] bg-white/70 items-center justify-center" style="display:none;">
  <div class="animate-spin rounded-full h-14 w-14 border-t-4 border-b-4" style="border-color:var(--sky);"></div>
</div>
<div id="toast"></div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzuV3TY4d7-6UyNJPLrr0xSdLhwQNHjWaVgTuaM60xlXDC9b75Ebpak_TXELS9x6Cxn7w/exec";
const API_KEY = "AIzaSyCg4cHbogYAIGUz41VnyjIyoTmA6ORjC2Q";

const METHODS = [
  { v: '',       label: '指定なし', icon: '📍', color: '#94a3b8' },
  { v: '車',     label: '車',     icon: '🚗', color: '#f97316' },
  { v: '徒歩',   label: '徒歩',   icon: '🚶', color: '#22c55e' },
  { v: '飛行機', label: '飛行機', icon: '✈️', color: '#0ea5e9' },
  { v: '新幹線', label: '新幹線', icon: '🚅', color: '#6366f1' },
  { v: '電車',   label: '電車',   icon: '🚃', color: '#14b8a6' },
  { v: 'バス',   label: 'バス',   icon: '🚌', color: '#eab308' },
  { v: 'その他', label: 'その他', icon: '🧭', color: '#a855f7' },
];
const WEEK = ['日','月','火','水','木','金','土'];
const STEP_MIN = 10;

const state = {
  tripLists: { active: [], archived: [] },
  currentTrip: null,
  schedules: [],
  mileage: {},
  scheduleCache: {},
  selectedDay: null,
  days: [],
  isEditing: false,
  editingId: null,
};
let directionsService = null;
let currentAutocomplete = null;

function initMapApi() {
  if (typeof google !== 'undefined' && google.maps) directionsService = new google.maps.DirectionsService();
}

/* ---------- ユーティリティ ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function methodInfo(v) { return METHODS.find(m => m.v === (v || '')) || METHODS[METHODS.length - 1]; }
function partsOf(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return { valid: false, date: 'undated', h: 9, m: 0 };
  return { valid: true, date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, h: d.getHours(), m: d.getMinutes() };
}
const dayKey = s => partsOf(s.datetime).date;
function toISO(dateStr, h, m) { return new Date(`${dateStr}T${pad(h)}:${pad(m)}:00`).toISOString(); }
function sortSchedules() {
  state.schedules.sort((a, b) => {
    const A = new Date(a.datetime).getTime(), B = new Date(b.datetime).getTime();
    return (isNaN(A) ? Infinity : A) - (isNaN(B) ? Infinity : B);
  });
}
function showLoading(on) { $('loading-spinner').style.display = on ? 'flex' : 'none'; }
let toastTimer;
function showToast(message, type = 'success') {
  const t = $('toast');
  t.textContent = message;
  t.style.background = type === 'error' ? '#ef4444' : '#0f766e';
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2800);
}

// 通信の本体(エラーは呼び出し側で処理)
async function rpc(action, ...args) {
  const response = await fetch(WEB_APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action, args })
  });
  if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
  const result = await response.json();
  if (result.success) return result.data;
  throw new Error(result.error || 'API側でエラーが発生しました');
}

// 通常の呼び出し(失敗時にトースト表示)
async function serverCall(action, ...args) {
  try {
    return await rpc(action, ...args);
  } catch (error) {
    console.error('Server Call Error:', error);
    showToast(`通信エラー: ${error.message}`, 'error');
    throw error;
  }
}

/* ---------- 端末内キャッシュ ---------- */
function lsGet(key) { try { return JSON.parse(localStorage.getItem('tp:' + key)); } catch (_) { return null; } }
function lsSet(key, val) { try { localStorage.setItem('tp:' + key, JSON.stringify(val)); } catch (_) {} }
function invalidateCache(trip) {
  delete state.scheduleCache[trip];
  try { localStorage.removeItem('tp:sch:' + trip); } catch (_) {}
}
function isBusy() { return !!drag || $('modal').classList.contains('open'); }

function destroyAutocompleteIfAny() {
  try {
    if (currentAutocomplete) {
      google.maps.event.clearInstanceListeners(currentAutocomplete);
    }
  } catch (e) {}
  currentAutocomplete = null;
  document.querySelectorAll('.pac-container').forEach(el => el.remove());
}

/* ---------- モーダル(ボトムシート) ---------- */
function openModal(title, bodyHtml, submitLabel, onSubmit) {
  const form = $('modal-form');
  form.innerHTML = `
    <div id="modal-sheet" class="relative bg-white w-full md:max-w-md rounded-t-3xl md:rounded-3xl flex flex-col shadow-2xl">
      <div class="flex items-center justify-between px-5 pt-4 pb-3 border-b border-[var(--line)] flex-shrink-0">
        <h3 class="text-lg font-bold">${esc(title)}</h3>
        <button type="button" id="modal-close" class="icon-btn" aria-label="閉じる">✕</button>
      </div>
      <div class="overflow-y-auto px-5 py-4 flex-1 min-h-0" style="-webkit-overflow-scrolling:touch;overscroll-behavior:contain;">${bodyHtml}</div>
      <div class="flex gap-2 px-5 pt-3 border-t border-[var(--line)] flex-shrink-0" style="padding-bottom:max(12px,env(safe-area-inset-bottom));">
        <button type="button" id="cancel-btn" class="flex-1 py-3 rounded-2xl bg-[#efe9df] font-bold">キャンセル</button>
        <button type="submit" id="submit-btn" class="flex-[2] py-3 rounded-2xl text-white font-bold" style="background:linear-gradient(135deg,var(--teal),var(--sky));">${esc(submitLabel)}</button>
      </div>
    </div>`;
  form.className = 'w-full flex justify-center';
  $('modal').classList.add('open');
  document.body.classList.add('modal-open');
  $('modal-close').addEventListener('click', hideModal);
  $('cancel-btn').addEventListener('click', hideModal);
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const btn = $('submit-btn');
    btn.disabled = true; btn.textContent = '保存中...';
    try {
      await onSubmit(new FormData(form), form);
    } catch (err) {
      showToast(err.message || 'エラーが発生しました', 'error');
      btn.disabled = false; btn.textContent = submitLabel;
    }
  };
}
function hideModal() {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  destroyAutocompleteIfAny();
  $('modal').classList.remove('open');
  $('modal-form').innerHTML = '';
  document.body.classList.remove('modal-open');
}

/* ---------- サイドバー ---------- */
function openSidebar() { $('sidebar').classList.remove('sidebar-closed'); $('sidebar-overlay').classList.add('show'); }
function closeSidebar() { $('sidebar').classList.add('sidebar-closed'); $('sidebar-overlay').classList.remove('show'); }

function renderTrips() {
  lsSet('trips', state.tripLists);  
  const tripList = $('trip-list');
  tripList.innerHTML = '';
  const createItem = (tripName, isArchived) => {
    const wrap = document.createElement('div'); wrap.className = 'relative';
    const btn = document.createElement('button');
    btn.className = 'trip-item' + (state.currentTrip === tripName ? ' active' : '');
    btn.textContent = tripName;
    btn.addEventListener('click', () => { handleTripSelect(tripName); closeSidebar(); });
    const menuBtn = document.createElement('button');
    menuBtn.className = 'icon-btn absolute right-0.5 top-1/2 -translate-y-1/2';
    menuBtn.innerHTML = '⋮';
    menuBtn.addEventListener('click', e => { e.stopPropagation(); toggleTripMenu(e.currentTarget); });
    const menu = document.createElement('div');
    menu.className = 'trip-menu hidden absolute right-0 top-full mt-1 w-44 bg-white rounded-xl shadow-lg z-20 border border-[var(--line)] overflow-hidden';
    menu.innerHTML = `
      <button class="w-full text-left px-4 py-2.5 text-sm hover:bg-gray-50" data-action="${isArchived ? 'unarchive' : 'archive'}" data-trip-name="${esc(tripName)}">${isArchived ? 'アクティブに戻す' : 'アーカイブする'}</button>
      <button class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50" data-action="delete" data-trip-name="${esc(tripName)}">削除</button>`;
    wrap.append(btn, menuBtn, menu);
    return wrap;
  };
  (state.tripLists.active || []).forEach(n => tripList.appendChild(createItem(n, false)));
  if (state.tripLists.archived && state.tripLists.archived.length) {
    const details = document.createElement('details');
    details.className = 'mt-4 pt-3 border-t border-[var(--line)]';
    details.innerHTML = '<summary class="font-bold text-sm text-[var(--sub)] cursor-pointer">📦 アーカイブ</summary>';
    const box = document.createElement('div'); box.className = 'mt-2 space-y-1';
    state.tripLists.archived.forEach(n => box.appendChild(createItem(n, true)));
    details.appendChild(box);
    tripList.appendChild(details);
  }
}
function toggleTripMenu(button) {
  closeAllTripMenus(button);
  button.nextElementSibling.classList.toggle('hidden');
}
function closeAllTripMenus(except = null) {
  document.querySelectorAll('.trip-menu').forEach(menu => {
    if (!except || menu.previousElementSibling !== except) menu.classList.add('hidden');
  });
}

function renderMileage() {
  lsSet('mileage', state.mileage); 
  const item = (p, a) => {
    const n = state.mileage?.[p]?.[a] || '未設定';
    return `<div class="flex items-center justify-between text-sm">
      <span class="font-bold text-[var(--sub)]">${a}</span>
      <span class="flex items-center gap-1">
        <span>${esc(n)}</span>
        <button data-person="${p}" data-airline="${a}" class="copy-btn icon-btn !w-7 !h-7" title="コピー">📋</button>
      </span></div>`;
  };
  const section = p => `<div><h4 class="font-bold text-sm">${p}</h4><div class="mt-1 space-y-1">${item(p,'ANA')}${item(p,'JAL')}</div></div>`;
  $('mileage-info').innerHTML = `
    <details>
      <summary class="font-bold text-sm text-[var(--sub)] cursor-pointer">✈ マイレージ情報</summary>
      <div class="mt-3 space-y-3">${section('ぱら')}${section('りな')}</div>
      <button id="edit-mileage-btn" class="mt-3 w-full text-sm bg-[#efe9df] font-bold py-2 rounded-xl">編集</button>
    </details>`;
  document.querySelectorAll('.copy-btn').forEach(b => b.addEventListener('click', handleCopyMileage));
  $('edit-mileage-btn').addEventListener('click', showEditMileageModal);
}

/* ---------- 予定描画 ---------- */
function computeDays() {
  const set = new Set(state.schedules.map(dayKey));
  state.days = [...set].sort((a, b) => a === 'undated' ? 1 : b === 'undated' ? -1 : a.localeCompare(b));
  if (!state.days.includes(state.selectedDay)) {
    const today = partsOf(new Date().toISOString()).date;
    state.selectedDay = state.days.includes(today) ? today : (state.days[0] || null);
  }
}
function chipLabel(key, idx) {
  if (key === 'undated') return { d1: '未定', d2: '日付なし' };
  const d = new Date(key + 'T00:00:00');
  return { d1: `${idx + 1}日目`, d2: `${d.getMonth()+1}/${d.getDate()}(${WEEK[d.getDay()]})` };
}

function renderSchedules() {
  computeDays();
  if (state.currentTrip) lsSet('sch:' + state.currentTrip, state.schedules); 
  const list = $('schedule-list');
  const bar = $('day-bar');
  const chips = $('day-chips');

  $('fab').classList.toggle('show', !!state.currentTrip);
  $('trip-sub').textContent = state.currentTrip
    ? `${state.days.filter(d => d !== 'undated').length}日間 ・ ${state.schedules.length}件の予定` : '';

  if (!state.currentTrip) { bar.classList.add('hidden'); list.innerHTML = ''; return; }

  if (!state.schedules.length) {
    bar.classList.add('hidden');
    $('hint').classList.add('hidden');
    list.innerHTML = `<div class="text-center text-[var(--sub)] mt-14">
      <p class="text-5xl mb-3">📝</p><p class="font-bold">まだ予定がありません</p>
      <p class="text-sm mt-1">右下の ＋ ボタンから最初の予定を追加しましょう</p></div>`;
    return;
  }

  bar.classList.remove('hidden');
  chips.innerHTML = state.days.map((k, i) => {
    const l = chipLabel(k, i);
    return `<button type="button" class="day-chip ${k === state.selectedDay ? 'active' : ''}" data-day="${k}"><span class="d1">${l.d1}</span><span class="d2">${l.d2}</span></button>`;
  }).join('');

  $('hint').classList.toggle('hidden', !!localStorage.getItem('hintClosed') || state.schedules.length < 2);

  const items = state.schedules.filter(s => dayKey(s) === state.selectedDay);
  list.innerHTML = `<div id="timeline">${items.map(cardHtml).join('')}</div>`;
}

function cardHtml(s) {
  const p = partsOf(s.datetime);
  const time = p.valid ? `${pad(p.h)}:${pad(p.m)}` : '--:--';
  const mi = methodInfo(s.method);
  const tags = [
    s.method ? `<span class="tag" style="background:${mi.color}22;color:${mi.color}">${mi.icon} ${esc(s.method)}</span>` : '',
    s.seatInfo ? `<span class="tag bg-gray-100 text-gray-700">💺 ${esc(s.seatInfo)}</span>` : ''
  ].join('');
  const links = [
    s.url ? `<a class="link-chip" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">🔗 参考1</a>` : '',
    s.url2 ? `<a class="link-chip" href="${esc(s.url2)}" target="_blank" rel="noopener noreferrer">🔗 参考2</a>` : '',
    s.parkingUrl ? `<a class="link-chip" href="${esc(s.parkingUrl)}" target="_blank" rel="noopener noreferrer">🅿️ 駐車場</a>` : ''
  ].join('');
  return `
  <div class="sch-row" data-id="${esc(s.id)}" style="--accent:${mi.color}">
    <div class="time-col"><button type="button" class="time-chip" data-action="time" data-id="${esc(s.id)}">${time}</button></div>
    <div class="rail"><span class="dot"></span></div>
    <div class="card-main">
      <div class="flex items-start justify-between gap-2">
        <h4 class="text-base font-bold leading-snug">${esc(s.destination || '(件名なし)')}</h4>
        <div class="flex flex-shrink-0 -mr-2 -mt-1">
          <button type="button" class="icon-btn" data-action="edit" data-id="${esc(s.id)}" title="編集">✏️</button>
          <button type="button" class="icon-btn" data-action="delete" data-id="${esc(s.id)}" title="削除">🗑️</button>
        </div>
      </div>
      ${tags ? `<div class="flex flex-wrap gap-1.5 mt-1.5">${tags}</div>` : ''}
      ${s.address ? `<p class="text-xs text-[var(--sub)] mt-2">📍 ${esc(s.address)}</p>` : ''}
      ${s.parkingInfo ? `<p class="text-xs text-[var(--sub)] mt-1 whitespace-pre-wrap">🅿️ ${esc(s.parkingInfo)}</p>` : ''}
      ${links ? `<div class="flex flex-wrap gap-1.5 mt-2">${links}</div>` : ''}
      ${s.memo ? `<p class="text-sm bg-[#faf6ee] rounded-xl p-2 mt-2 whitespace-pre-wrap">${esc(s.memo)}</p>` : ''}
      ${s.address ? `
        <div class="mt-2.5 pt-2.5 border-t border-dashed border-[var(--line)]">
          <div class="flex items-center gap-2">
            <button type="button" class="text-xs bg-[#efe9df] font-bold py-1 px-3 rounded-full" data-action="map" data-address="${esc(s.address)}">🗺 地図を表示</button>
            <a class="text-xs border border-[var(--line)] font-bold py-1 px-3 rounded-full" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}" target="_blank" rel="noopener noreferrer">アプリで開く</a>
          </div>
          <div class="map-container hidden mt-2 h-44 bg-gray-200 rounded-xl overflow-hidden"></div>
        </div>` : ''}
    </div>
  </div>`;
}

/* ---------- 旅行の選択・初期化 ---------- */
async function init() {
  const cTrips = lsGet('trips'), cMileage = lsGet('mileage');
  const last = localStorage.getItem('lastSelectedTrip');
  const inLists = (l, n) => !!l && ((l.active || []).includes(n) || (l.archived || []).includes(n));
  const hasCache = !!cTrips;

  if (hasCache) {                      // 保存済みデータを先に表示
    state.tripLists = cTrips;
    state.mileage = cMileage || { 'ぱら': {}, 'りな': {} };
    renderTrips(); renderMileage();
    if (last && inLists(cTrips, last)) handleTripSelect(last);
  } else showLoading(true);

  try {
    const [tripLists, mileage] = await Promise.all([rpc('getTrips'), rpc('getMileage')]);
    state.tripLists = tripLists || { active: [], archived: [] };
    state.mileage = mileage || { 'ぱら': {}, 'りな': {} };
    renderTrips(); renderMileage();
    if (!hasCache && last && inLists(state.tripLists, last)) await handleTripSelect(last);
  } catch (e) {
    console.error('Initialization failed', e);
    if (hasCache) showToast('オフライン表示中(保存済みのデータ)', 'error');
    else $('welcome-message').innerHTML = '<p class="text-red-500 font-bold">データの初期化に失敗しました。</p>';
  } finally {
    showLoading(false);
  }
}

async function handleTripSelect(tripName) {
  state.currentTrip = tripName;
  state.selectedDay = null;
  localStorage.setItem('lastSelectedTrip', tripName);
  $('current-trip-name').textContent = tripName;
  $('welcome-message').classList.add('hidden');
  renderTrips();
  $('main').scrollTop = 0;

  if (state.scheduleCache[tripName]) {
    state.schedules = state.scheduleCache[tripName];
    renderSchedules();
    return;
  }
    // 端末に保存済みなら先に表示し、裏で最新を取得
  const cached = lsGet('sch:' + tripName);
  if (cached) {
    state.schedules = cached;
    renderSchedules();
  } else {
    state.schedules = [];
    $('day-bar').classList.add('hidden');
    $('schedule-list').innerHTML = '<div class="text-center text-[var(--sub)] p-10">読み込み中...</div>';
  }

  try {
    const fresh = (await rpc('getSchedules', tripName)) || [];
    if (state.currentTrip !== tripName) return;
    if (cached && isBusy()) return;               // 操作中は画面を差し替えない
    state.schedules = fresh;
    state.scheduleCache[tripName] = fresh;
    if (!cached || JSON.stringify(cached) !== JSON.stringify(fresh)) renderSchedules();
  } catch (e) {
    console.error(`Failed to get schedules for ${tripName}`, e);
    if (state.currentTrip !== tripName) return;
    if (cached) showToast('オフライン表示中(保存済みのデータ)', 'error');
    else $('schedule-list').innerHTML = '<div class="text-center text-red-500 p-10">予定の読み込みに失敗しました。</div>';
  }
}

async function reloadCurrentTrip() {
  const t = state.currentTrip;
  invalidateCache(t);
  await handleTripSelect(t);
}

/* ---------- 時刻セレクト(10分刻み) ---------- */
function timeSelectsHtml(h, m, idPrefix = '') {
  const hours = Array.from({ length: 24 }, (_, i) => `<option value="${i}" ${i === h ? 'selected' : ''}>${pad(i)}</option>`).join('');
  const mins = new Set(); for (let i = 0; i < 60; i += STEP_MIN) mins.add(i);
  mins.add(m); // 既存データが10分刻みでなくても失わない
  const minOpts = [...mins].sort((a, b) => a - b).map(i => `<option value="${i}" ${i === m ? 'selected' : ''}>${pad(i)}</option>`).join('');
  return `<div class="flex items-center gap-2 mt-1">
    <select id="${idPrefix}hour" name="hour" class="field !mt-0 text-center">${hours}</select>
    <span class="font-bold">:</span>
    <select id="${idPrefix}minute" name="minute" class="field !mt-0 text-center">${minOpts}</select></div>`;
}

function showTimeModal(id) {
  const s = state.schedules.find(x => x.id === id); if (!s) return;
  const p = partsOf(s.datetime);
  openModal('時刻を変更', `<p class="text-sm text-[var(--sub)] mb-2">${esc(s.destination || '')}</p>
    <label class="lbl">時刻</label>${timeSelectsHtml(p.h, p.m)}`, '変更', async (fd) => {
      const updated = { ...s, datetime: toISO(p.date, +fd.get('hour'), +fd.get('minute')) };
      hideModal();
      await persistChanges([updated]);
    });
}

/* ---------- 予定の追加・編集モーダル ---------- */
function showScheduleModal(isEditing = false, id = null) {
  state.isEditing = isEditing; state.editingId = id;
  const s = isEditing ? (state.schedules.find(x => x.id === id) || {}) : {};
  let p;
  if (isEditing && s.datetime) p = partsOf(s.datetime);
  else {
    const day = state.selectedDay && state.selectedDay !== 'undated' ? state.selectedDay : partsOf(new Date().toISOString()).date;
    const dayItems = state.schedules.filter(x => dayKey(x) === day);
    const last = dayItems[dayItems.length - 1];
    let h = 9, m = 0;
    if (last) { const lp = partsOf(last.datetime); h = Math.min(23, lp.h + 1); m = lp.m; }
    p = { date: day, h, m };
  }
  const hasMore = !!(s.parkingInfo || s.parkingUrl || s.url || s.url2 || s.memo);
  const chips = METHODS.map(mt => `<button type="button" class="m-chip ${((s.method || '') === mt.v) ? 'active' : ''}" data-v="${mt.v}">${mt.icon} ${mt.label}</button>`).join('');

  openModal(isEditing ? '予定を編集' : '予定を追加', `
    <div class="space-y-4">
      <div><label class="lbl">予定の件名</label>
        <input type="text" id="destination" name="destination" value="${esc(s.destination || '')}" class="field" placeholder="例: 首里城" autocomplete="off"></div>
      <div class="grid grid-cols-5 gap-3">
        <div class="col-span-3"><label class="lbl">日付</label>
          <input type="date" id="date" name="date" value="${p.date}" class="field"></div>
        <div class="col-span-2"><label class="lbl">時刻(10分刻み)</label>${timeSelectsHtml(p.h, p.m)}</div>
      </div>
      <div><label class="lbl">場所・住所</label>
        <input type="text" id="address" name="address" value="${esc(s.address || '')}" class="field" placeholder="検索して選択できます" autocomplete="off"></div>
      <div><label class="lbl">移動手段</label>
        <input type="hidden" id="method" name="method" value="${esc(s.method || '')}">
        <div id="method-chips" class="flex gap-2 overflow-x-auto no-scrollbar mt-1 pb-1">${chips}</div></div>
      <div id="seat-info-container" class="hidden"><label class="lbl">座席情報</label>
        <input type="text" id="seatInfo" name="seatInfo" value="${esc(s.seatInfo || '')}" class="field"></div>
      <div id="route-search-container" class="hidden p-3 bg-[#faf6ee] rounded-2xl space-y-2"></div>
      <details class="more" ${hasMore ? 'open' : ''}>
        <summary>➕ 詳細(駐車場・URL・メモ)</summary>
        <div class="space-y-3">
          <div><label class="lbl">駐車場の詳細(料金、場所など)</label>
            <textarea id="parkingInfo" name="parkingInfo" rows="2" class="field">${esc(s.parkingInfo || '')}</textarea></div>
          <div><label class="lbl">駐車場 参考URL</label>
            <input type="url" name="parkingUrl" value="${esc(s.parkingUrl || '')}" class="field"></div>
          <div><label class="lbl">参考URL 1</label>
            <input type="url" name="url" value="${esc(s.url || '')}" class="field"></div>
          <div><label class="lbl">参考URL 2</label>
            <input type="url" name="url2" value="${esc(s.url2 || '')}" class="field"></div>
          <div><label class="lbl">メモ</label>
            <textarea id="memo" name="memo" rows="3" class="field">${esc(s.memo || '')}</textarea></div>
        </div>
      </details>
    </div>`,
    '保存', async (fd) => {
      const dest = (fd.get('destination') || '').trim();
      const dateStr = fd.get('date');
      if (!dest) throw new Error('件名を入力してください');
      if (!dateStr) throw new Error('日付を入力してください');
      const finalSchedule = {
        id: state.isEditing ? state.editingId : null,
        method: fd.get('method') || '',
        datetime: toISO(dateStr, +fd.get('hour'), +fd.get('minute')),
        destination: dest,
        address: fd.get('address') || '',
        url: fd.get('url') || '',
        url2: fd.get('url2') || '',
        memo: fd.get('memo') || '',
        seatInfo: fd.get('seatInfo') || '',
        parkingInfo: fd.get('parkingInfo') || '',
        parkingUrl: fd.get('parkingUrl') || ''
      };
      await serverCall(state.isEditing ? 'updateSchedule' : 'addSchedule', state.currentTrip, finalSchedule);
      invalidateCache(state.currentTrip);
      state.selectedDay = dateStr;
      hideModal();
      showToast(`予定を${state.isEditing ? '更新' : '追加'}しました`);
      const keepDay = dateStr;
      await handleTripSelect(state.currentTrip);
      if (state.days.includes(keepDay)) { state.selectedDay = keepDay; renderSchedules(); }
    });

  /* オートコンプリート */
  const addressInput = $('address');
  if (window.google && google.maps && google.maps.places) {
    destroyAutocompleteIfAny();
    currentAutocomplete = new google.maps.places.Autocomplete(addressInput, { fields: ['formatted_address', 'name'] });
    currentAutocomplete.addListener('place_changed', () => {
      const place = currentAutocomplete.getPlace(); if (!place) return;
      let addr = place.formatted_address || '';
      if (place.name && addr.includes(place.name)) {
        addr = addr.replace(place.name, '').replace(/^〒[0-9-]+/, '').trim();
        if (addr.startsWith('、') || addr.startsWith(',')) addr = addr.substring(1).trim();
      }
      $('address').value = addr;
      if (place.name && !$('destination').value) $('destination').value = place.name;
    });
  }
  // Enterキーで送信されないように(オートコンプリート選択時の誤爆防止)
  addressInput.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });

  /* 移動手段チップ */
  const toggleDetail = () => {
    const v = $('method').value;
    $('seat-info-container').classList.toggle('hidden', !['飛行機', '新幹線'].includes(v));
    const rc = $('route-search-container');
    const showRoute = ['車', '徒歩'].includes(v);
    rc.classList.toggle('hidden', !showRoute);
    if (showRoute && !rc.dataset.ready) {
      let prev = '';
      const idx = state.isEditing ? state.schedules.findIndex(x => x.id === state.editingId) : state.schedules.length;
      for (let i = idx - 1; i >= 0; i--) { if (state.schedules[i].address) { prev = state.schedules[i].address; break; } }
      rc.innerHTML = `<h5 class="text-sm font-bold">🧭 ルート検索</h5>
        <div><label class="lbl">出発地</label><input type="text" id="origin" value="${esc(prev)}" class="field"></div>
        <button type="button" id="route-search-btn" class="w-full bg-[var(--teal)] text-white font-bold py-2 rounded-xl text-sm">検索</button>
        <div id="route-results" class="text-sm"></div>`;
      $('route-search-btn').addEventListener('click', handleRouteSearch);
      rc.dataset.ready = '1';
    }
  };
  $('method-chips').addEventListener('click', e => {
    const b = e.target.closest('.m-chip'); if (!b) return;
    $('method').value = b.dataset.v;
    document.querySelectorAll('#method-chips .m-chip').forEach(c => c.classList.toggle('active', c === b));
    toggleDetail();
  });
  toggleDetail();
}

function handleRouteSearch() {
  const o = $('origin').value, d = $('address').value, r = $('route-results');
  if (!o || !d) { r.innerHTML = '<p class="text-red-600">出発地と目的地を入力してください。</p>'; return; }
  if (!directionsService && window.google && google.maps) directionsService = new google.maps.DirectionsService();
  if (!directionsService) { r.innerHTML = '<p class="text-red-600">地図APIの読み込み中です。少し待ってからお試しください。</p>'; return; }
  r.innerHTML = '<p class="text-gray-500">検索中...</p>';
  const mode = $('method').value === '徒歩' ? 'WALKING' : 'DRIVING';
  directionsService.route({ origin: o, destination: d, travelMode: google.maps.TravelMode[mode] }, (res, status) => {
    if (status === 'OK') {
      const l = res.routes[0].legs[0];
      r.innerHTML = `<div class="p-2 bg-green-50 border-l-4 border-green-400 rounded"><p><b>距離:</b> ${esc(l.distance.text)}</p><p><b>所要時間:</b> ${esc(l.duration.text)}</p></div>`;
      const memo = $('memo');
      const info = `[ルート情報: ${o} → ${d}, 所要時間: ${l.duration.text}]`;
      const rest = memo.value.replace(/\[ルート情報:.*?\]\n?/, '');
      memo.value = `${info}\n${rest}`.trim();
    } else {
      r.innerHTML = `<p class="text-red-600">ルートが見つかりませんでした: ${esc(status)}</p>`;
    }
  });
}

async function persistChanges(changed) {
  if (!changed.length) return;
  const backup = state.schedules.map(s => ({ ...s }));   // 失敗時に元へ戻す用
  changed.forEach(u => {
    const i = state.schedules.findIndex(x => x.id === u.id);
    if (i >= 0) state.schedules[i] = u;
  });
  sortSchedules();
  state.scheduleCache[state.currentTrip] = state.schedules;
  renderSchedules();
  try {
    await serverCall('updateSchedules', state.currentTrip, changed);   // 1回の通信でまとめて保存
    showToast('保存しました');
  } catch (e) {
    state.schedules = backup;
    state.scheduleCache[state.currentTrip] = backup;
    renderSchedules();
  }
}

async function handleDeleteSchedule(id) {
  if (!confirm('この予定を本当に削除しますか？')) return;
  try {
    await serverCall('deleteSchedule', state.currentTrip, id);
    invalidateCache(state.currentTrip);
    showToast('予定を削除しました');
    const keep = state.selectedDay;
    await handleTripSelect(state.currentTrip);
    if (state.days.includes(keep)) { state.selectedDay = keep; renderSchedules(); }
  } catch (e) {}
}

/* ---------- 旅行のアーカイブ・削除 ---------- */
function resetCurrentIfNeeded(tripName) {
  if (state.currentTrip === tripName) {
    state.currentTrip = null; state.schedules = [];
    $('current-trip-name').textContent = '旅行を選択';
    $('welcome-message').classList.remove('hidden');
    renderSchedules();
  }
}
async function handleArchiveTrip(name) {
  if (!confirm(`「${name}」をアーカイブしますか？`)) return;
  await serverCall('archiveTrip', name);
  resetCurrentIfNeeded(name);
  state.tripLists = await serverCall('getTrips'); renderTrips(); showToast('旅行をアーカイブしました');
}
async function handleUnarchiveTrip(name) {
  await serverCall('unarchiveTrip', name);
  state.tripLists = await serverCall('getTrips'); renderTrips(); showToast('旅行をアクティブに戻しました');
}
async function handleDeleteTrip(name) {
  if (!confirm(`本当に「${name}」を削除しますか？\nこの操作は取り消せません。`)) return;
  await serverCall('deleteTrip', name);
  invalidateCache(name);
  resetCurrentIfNeeded(name);
  state.tripLists = await serverCall('getTrips'); renderTrips(); showToast('旅行を削除しました');
}

/* ---------- 地図トグル ---------- */
function handleMapToggle(button) {
  const wrap = button.closest('.card-main');
  const box = wrap && wrap.querySelector('.map-container'); if (!box) return;
  if (box.classList.contains('hidden')) {
    if (!box.dataset.loaded) {
      const iframe = document.createElement('iframe');
      iframe.width = '100%'; iframe.height = '100%'; iframe.style.border = '0'; iframe.allowFullscreen = true;
      iframe.src = `https://www.google.com/maps/embed/v1/place?key=${API_KEY}&q=${encodeURIComponent(button.dataset.address)}`;
      box.innerHTML = ''; box.appendChild(iframe); box.dataset.loaded = '1';
    }
    box.classList.remove('hidden'); button.textContent = '🗺 地図を隠す';
  } else {
    box.classList.add('hidden'); button.textContent = '🗺 地図を表示';
  }
}

/* ---------- 長押しドラッグ(並び替え・日付移動) ---------- */
const LONG_PRESS_MS = 380;
let press = null;   // 長押し待機中
let drag = null;    // ドラッグ中
let lastTouchAt = 0;

function getPt(e) {
  const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
  return { x: t.clientX, y: t.clientY };
}

function onPressStart(e) {
  if (e.type === 'mousedown') {
    if (Date.now() - lastTouchAt < 700 || e.button !== 0) return;
  } else lastTouchAt = Date.now();
  if (drag || state.selectedDay === 'undated') return;
  const row = e.target.closest('.sch-row');
  if (!row || e.target.closest('button,a,iframe,.map-container')) return;
  const pt = getPt(e);
  press = { row, start: pt, last: pt, timer: setTimeout(() => beginDrag(row, press.last), LONG_PRESS_MS) };
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchend', onEnd);
  document.addEventListener('touchcancel', onEnd);
  document.addEventListener('mouseup', onEnd);
}

function cleanupListeners() {
  document.removeEventListener('touchmove', onMove);
  document.removeEventListener('mousemove', onMove);
  document.removeEventListener('touchend', onEnd);
  document.removeEventListener('touchcancel', onEnd);
  document.removeEventListener('mouseup', onEnd);
}

const PX_PER_MIN = 1.2, AXIS_PAD = 22;
const minToY = min => AXIS_PAD + min * PX_PER_MIN;

function buildAxis(dragId) {
  const mr = $('main').getBoundingClientRect();
  const bar = $('day-bar');
  const top = bar.classList.contains('hidden') ? mr.top : bar.getBoundingClientRect().bottom;
  const el = document.createElement('div'); el.id = 'axis';
  Object.assign(el.style, { left: mr.left + 'px', width: mr.width + 'px', top: top + 'px', height: (mr.bottom - top) + 'px' });
  let html = `<div id="axis-scroll"><div id="axis-track" style="height:${AXIS_PAD * 2 + 1440 * PX_PER_MIN}px">`;
  for (let h = 0; h <= 24; h++) {
    html += `<div class="ax-hour" style="top:${minToY(h * 60)}px"><span>${pad(h)}:00</span></div>`;
    if (h < 24) html += `<div class="ax-half" style="top:${minToY(h * 60 + 30)}px"></div>`;
  }
  const others = state.schedules.filter(x => dayKey(x) === state.selectedDay && x.id !== dragId)
    .map(x => { const q = partsOf(x.datetime); return { x, min: q.h * 60 + q.m, q }; })
    .sort((m, n) => m.min - n.min);
  const laneEnds = [];
  others.forEach(o => {
    const t = minToY(o.min);
    let lane = laneEnds.findIndex(end => end <= t);
    if (lane < 0) { lane = laneEnds.length; laneEnds.push(0); }
    laneEnds[lane] = t + 24;
    const mi = methodInfo(o.x.method);
    html += `<div class="ax-item" style="top:${t - 11}px;left:${64 + lane * 146}px;--accent:${mi.color}"><b>${pad(o.q.h)}:${pad(o.q.m)}</b> ${esc(o.x.destination || '')}</div>`;
  });
  html += `<div id="ax-line"><span id="ax-badge">--:--</span></div></div></div>`;
  el.innerHTML = html;
  return el;
}

function beginDrag(row, pt) {
  const s = state.schedules.find(x => x.id === row.dataset.id);
  if (!s) return;
  const p = partsOf(s.datetime), mi = methodInfo(s.method);
  const axis = buildAxis(s.id);
  document.body.appendChild(axis);
  const scroll = axis.querySelector('#axis-scroll');
  scroll.scrollTop = Math.max(0, minToY(p.h * 60 + p.m) - scroll.clientHeight * 0.4);

  const ar = axis.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost drag-chip';
  ghost.style.setProperty('--accent', mi.color);
  ghost.style.left = (ar.left + 60) + 'px';
  ghost.style.width = (ar.width - 76) + 'px';
  ghost.innerHTML = `<span class="gt">${pad(p.h)}:${pad(p.m)}</span><span class="gn">${mi.icon} ${esc(s.destination || '(件名なし)')}</span>`;
  document.body.appendChild(ghost);

  row.classList.add('dragging');
  document.body.classList.add('dragging');
  if (navigator.vibrate) { try { navigator.vibrate(25); } catch (_) {} }
  drag = { row, ghost, axis, scroll, id: s.id, pt, targetDay: null, minutes: null, raf: null };

  const loop = () => {
    if (!drag) return;
    const r = drag.axis.getBoundingClientRect(), zone = 80;
    let dy = 0;
    if (drag.pt.y > r.bottom - zone) dy = Math.min(16, (drag.pt.y - (r.bottom - zone)) / 4);
    else if (drag.pt.y < r.top + zone && drag.pt.y >= r.top) dy = -Math.min(16, ((r.top + zone) - drag.pt.y) / 4);
    if (dy) { drag.scroll.scrollTop += dy; updateDrag(); }
    drag.raf = requestAnimationFrame(loop);
  };
  updateDrag();
  drag.raf = requestAnimationFrame(loop);
}

function updateDrag() {
  if (!drag) return;
  const { pt, ghost, axis, scroll } = drag;
  const line = axis.querySelector('#ax-line'), badge = axis.querySelector('#ax-badge');
  ghost.style.top = (pt.y - 72) + 'px';

  // 日付チップ上か判定(日付移動)
  const under = document.elementFromPoint(pt.x, pt.y);
  const chip = under && under.closest && under.closest('.day-chip');
  document.querySelectorAll('.day-chip.drop-target').forEach(c => c.classList.remove('drop-target'));
  if (chip && chip.dataset.day !== state.selectedDay && chip.dataset.day !== 'undated') {
    chip.classList.add('drop-target');
    drag.targetDay = chip.dataset.day; drag.minutes = null;
    line.style.display = 'none';
    return;
  }
  drag.targetDay = null;

  // 24時間軸上の位置 → 時刻(10分刻み)
  const ar = axis.getBoundingClientRect();
  if (pt.y >= ar.top && pt.y <= ar.bottom) {
    const rel = pt.y - ar.top + scroll.scrollTop - AXIS_PAD;
    let min = Math.round(rel / PX_PER_MIN / STEP_MIN) * STEP_MIN;
    min = Math.max(0, Math.min(23 * 60 + 50, min));
    drag.minutes = min;
    const label = `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
    line.style.display = 'block'; line.style.top = minToY(min) + 'px';
    badge.textContent = label;
    ghost.querySelector('.gt').textContent = label;
  } else {
    drag.minutes = null; line.style.display = 'none';
  }
}

function onMove(e) {
  const pt = getPt(e);
  if (press) press.last = pt;
  if (drag) {
    e.preventDefault();
    drag.pt = pt;
    updateDrag();
    return;
  }
  if (press && Math.hypot(pt.x - press.start.x, pt.y - press.start.y) > 10) {
    clearTimeout(press.timer); press = null; cleanupListeners(); // スクロール意図 → キャンセル
  }
}

function onEnd() {
  if (press) { clearTimeout(press.timer); press = null; }
  cleanupListeners();
  if (!drag) return;
  const d = drag; drag = null;
  cancelAnimationFrame(d.raf);
  d.ghost.remove(); d.axis.remove();
  d.row.classList.remove('dragging');
  document.body.classList.remove('dragging');
  document.querySelectorAll('.day-chip.drop-target').forEach(c => c.classList.remove('drop-target'));

  const s = state.schedules.find(x => x.id === d.id);
  if (!s) return;
  const p = partsOf(s.datetime);

  if (d.targetDay) {
    showToast(`${chipLabel(d.targetDay, state.days.indexOf(d.targetDay)).d2} に移動しました`);
    persistChanges([{ ...s, datetime: toISO(d.targetDay, p.h, p.m) }]);
    return;
  }
  if (d.minutes != null && d.minutes !== p.h * 60 + p.m) {
    persistChanges([{ ...s, datetime: toISO(p.date, Math.floor(d.minutes / 60), d.minutes % 60) }]);
  }
}

/* ---------- イベント登録 ---------- */
$('open-sidebar-btn').addEventListener('click', openSidebar);
$('close-sidebar-btn').addEventListener('click', closeSidebar);
$('sidebar-overlay').addEventListener('click', closeSidebar);
$('add-trip-btn').addEventListener('click', showAddTripModal);
$('fab').addEventListener('click', () => showScheduleModal(false));
$('modal-backdrop').addEventListener('click', hideModal);
$('hint-close').addEventListener('click', () => { localStorage.setItem('hintClosed', '1'); $('hint').classList.add('hidden'); });

$('day-chips').addEventListener('click', e => {
  const c = e.target.closest('.day-chip'); if (!c) return;
  state.selectedDay = c.dataset.day; renderSchedules(); $('main').scrollTop = 0;
});

$('schedule-list').addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action;
  if (a === 'edit') showScheduleModal(true, b.dataset.id);
  else if (a === 'delete') handleDeleteSchedule(b.dataset.id);
  else if (a === 'time') showTimeModal(b.dataset.id);
  else if (a === 'map') handleMapToggle(b);
});
$('schedule-list').addEventListener('touchstart', onPressStart, { passive: true });
$('schedule-list').addEventListener('mousedown', onPressStart);
$('schedule-list').addEventListener('contextmenu', e => { if (e.target.closest('.sch-row')) e.preventDefault(); });

$('trip-list').addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, n = b.dataset.tripName;
  closeAllTripMenus();
  if (a === 'archive') handleArchiveTrip(n);
  else if (a === 'unarchive') handleUnarchiveTrip(n);
  else if (a === 'delete') handleDeleteTrip(n);
});
document.addEventListener('click', e => { if (!e.target.closest('#trip-list')) closeAllTripMenus(); });

/* ---------- オンライン/オフライン表示 ---------- */
function updateOnline() { $('offline-badge').classList.toggle('hidden', navigator.onLine); }
window.addEventListener('offline', updateOnline);
window.addEventListener('online', async () => {
  updateOnline();
  if (!state.currentTrip || isBusy()) return;
  const keepDay = state.selectedDay;
  invalidateCache(state.currentTrip);
  await handleTripSelect(state.currentTrip);
  if (state.days.includes(keepDay)) { state.selectedDay = keepDay; renderSchedules(); }
});
updateOnline();

/* ---------- PWA(サービスワーカー登録) ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

init();
</script>
